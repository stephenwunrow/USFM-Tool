<!DOCTYPE html>
<html>
<head>
    <title>Translations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .section {
            margin-top: 40px;
        }

        textarea {
            width: 400px;
            height: 40px;
            padding: 6px;
            font-size: 15px;
        }

        button {
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .output-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            white-space: pre-wrap;
            max-width: 900px;
        }
    </style>
</head>
<body>

    <h1>Translations</h1>

    <br><br>
    <form action="/" method="get">
        <button type="submit">Return to Searching</button>
    </form>
    <br><br>

    <!-- Download Section -->
    <form method="get" action="{{ url_for('download_accordance') }}">
        <button type="submit">Download Bibles for Accordance</button>
    </form>


    <!-- Display Texts Section -->
    <div class="section">
        <h2>Display Texts</h2>

        <form method="post">
            <input
                type="text"
                name="user_input"
                class="textarea"
                placeholder="e.g. 1 Thessalonians 4:12"
            />

            <br><br>

            <button type="submit">Run Script</button>
        </form>


        {% if output %}
            <div class="output-box">{{ output }}</div>
        {% endif %}
    </div>

</body>
</html>
