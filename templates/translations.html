<!DOCTYPE html>
<html>
<head>
    <title>Translations</title>

    <style>

        .highlight {
            color: purple;
            font-weight: bold;
        }

        .ref {
            font-weight: bold;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .section {
            margin-top: 40px;
        }

        textarea {
            width: 400px;
            height: 40px;
            padding: 6px;
            font-size: 15px;
        }

        button {
            padding: 2px 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .input-row {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .input-block {
            display: flex;
            flex-direction: column;
        }

        input[type="text"] {
            width: 300px;
            height: 35px;
            padding: 6px;
            font-size: 14px;
        }

        .output-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            white-space: pre-wrap;
            max-width: 900px;
        }
    </style>
</head>
<body>

    <h1>Translations</h1>

    <form action="/" method="get">
        <button type="submit">Return to Searching</button>
    </form>
    <br>

    <!-- Download Section -->
    <form method="get" action="{{ url_for('download_accordance') }}">
        <button type="submit">Download Bibles for Accordance</button>
    </form>


    <!-- Display Texts Section -->
    <div class="section">
        <h2>Display Verse or Search</h2>

        <form method="post">

            <div class="input-row">

                <div class="input-block">
                    <label>Verse Lookup</label><br>
                    <input
                        type="text"
                        name="verse_input"
                        placeholder="e.g. 1 Thess 4:12"
                    />
                </div>

                <div class="input-block">
                    <label>Search</label><br>
                    <input
                        type="text"
                        name="search_input"
                        placeholder='e.g. love or "love your neighbor"'
                    />
                </div>

                <!-- Radio buttons BELOW inputs -->
                <div class="input-block">
                    <label>Translation</label><br>

                    <label>
                        <input type="radio" name="version" value="ULT" checked>
                        ULT
                    </label>

                    <label>
                        <input type="radio" name="version" value="UST">
                        UST
                    </label>
                </div>

            <!-- Run button BELOW everything -->
            <div>
                <button type="submit">Run</button>
            </div>

        </form>


        {% if output %}
            <div class="output-box">{{ output | safe }}</div>
        {% endif %}
    </div>

</body>
</html>
